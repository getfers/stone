<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pet Rock PiP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" width="480" height="270"></canvas>
  <video id="pipVideo" muted playsinline autoplay></video>
  <div class="controls">
    <div class="row">
      <button id="pipBtn">В окно (PiP)</button>
      <button class="sec" id="tiltBtn">Гироскоп: ВЫКЛ</button>
      <button class="sec" onclick="startDrinkScene()">Выпить</button>
      <button class="sec" onclick="startSushiGame()">Ловить</button>
    </div>
    <div class="row">
      <button class="sec" onclick="startVape()">Попарить</button>
      <button class="sec" onclick="startSushiScene()">Роллы</button>
      <button class="sec" onclick="startBulbScene()">Лампочка</button>
      <button class="sec" onclick="startBlocksScene()">Кубики</button>
      <button class="sec" onclick="startSlideScene()">Горка</button>
      <button class="sec" onclick="startFightScene()">Бой</button>
    </div>
  </div>

 <script src="costumes.js?v=12"></script>
  <script src="scenes.js?v=12"></script>
  <script src="main.js?v=12"></script>
</body>
</html>
