<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pet Rock PiP</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100vh; margin: 0; padding: 16px; background: #18191c; color: #e4e4e7; overflow: hidden; }
    canvas { width: min(92vw, 360px); height: calc(min(92vw, 360px) * 0.5625); background: #232529; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #32353b; touch-action: none; }
    .controls { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 360px); }
    .row { display: flex; gap: 6px; width: 100%; }
    button { padding: 12px 4px; font-size: 12.5px; font-weight: 600; color: white; background: #3f424a; border: 1px solid #525660; border-radius: 14px; flex: 1; cursor: pointer; white-space: nowrap; }
    button.sec { background: #2b2d33; color: #e4e4e7; }
    button.active { background: #2563eb; border-color: #3b82f6; }
    button:active { opacity: 0.8; }
    video { width: 1px; height: 1px; opacity: 0.01; position: absolute; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="scene" width="480" height="270"></canvas>
  <video id="pipVideo" muted playsinline autoplay></video>
  <div class="controls">
    <div class="row">
      <button id="pipBtn">В окно (PiP)</button>
      <button class="sec" id="tiltBtn">Гироскоп: ВЫКЛ</button>
      <button class="sec" id="costumeBtn" onclick="nextCostume()">Костюм: Нет</button>
    </div>
    <div class="row">
      <button class="sec" onclick="startVape()">Попарить</button>
      <button class="sec" onclick="startBulbScene()">Лампочка</button>
      <button class="sec" onclick="startBlocksScene()">Кубики</button>
      <button class="sec" onclick="startSlideScene()">Горка</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('pipVideo');
    const btn = document.getElementById('pipBtn');
    const tiltBtn = document.getElementById('tiltBtn');
    const costumeBtn = document.getElementById('costumeBtn');

    // Костюмы: 0 - Нет, 1 - Джокер, 2 - Бэтмен, 3 - Чаки, 4 - Майкл Майерс
    const costumes = ['none', 'joker', 'batman', 'chucky', 'myers'];
    const costumeNames = ['Нет', 'Джокер', 'Бэтмен', 'Чаки', 'Майерс'];
    let currentCostume = 0;

    function nextCostume() {
      currentCostume = (currentCostume + 1) % costumes.length;
      costumeBtn.textContent = 'Костюм: ' + costumeNames[currentCostume];
      // Легкий желейный подпрыг при переодевании
      for (let i = 0; i < NUM_POINTS; i++) {
        nodes[i].vy -= (nodes[i].oy < 0 ? 5 : 2);
      }
    }

    const emotions = ['classic', 'happy', 'sad', 'surprised'];
    let currentEmotion = 0;
    let nextEmotionTime = Date.now() + 5000 + Math.random() * 4000;

    let walker = {
      isWalking: false,
      targetX: 240,
      nextWalkTime: Date.now() + 1500
    };

    let vape = {
      active: false,
      timer: 0,
      duration: 210,
      nextAutoTime: Date.now() + 10000 + Math.random() * 8000,
      blueLevel: 0
    };
    let vaporParticles = [];

    let life = {
      state: 'alive',
      timer: 0,
      scale: 1,
      ghostY: 0,
      ghostAlpha: 0
    };

    let bulbScene = {
      active: false,
      timer: 0,
      ladderVisible: false,
      bulbState: 'none',
      shards: [],
      flashAlpha: 0
    };

    let blocksScene = {
      active: false,
      timer: 0,
      phase: 'falling',
      currentIdx: 0,
      blocks: [],
      shapeType: 0
    };

    let slideScene = {
      active: false,
      phase: 'approach',
      timer: 0,
      progress: 0,
      speed: 0
    };

    const NUM_POINTS = 16;
    let nodes = [];
    let center = { x: 240, y: 155, vx: 0, vy: 0 };
    let isDragging = false;
    let dragMoved = false;
    let lastPointer = { x: 0, y: 0 };

    let gravity = { x: 0, y: 0.42 };
    let tiltEnabled = false;

    function initNodes(customScale) {
      const s = customScale || life.scale || 1;
      nodes = [];
      for (let i = 0; i < NUM_POINTS; i++) {
        const angle = (i / NUM_POINTS) * Math.PI * 2;
        let baseR = 62 * s;
        if (Math.sin(angle) > 0) baseR += Math.sin(angle) * 9 * s;
        if (Math.cos(angle) < 0 && Math.sin(angle) > 0) baseR += 4 * s;
        const ox = Math.cos(angle) * baseR;
        const oy = Math.sin(angle) * (baseR * 0.94);
        nodes.push({ ox, oy, x: center.x + ox, y: center.y + oy, vx: 0, vy: 0 });
      }
    }
    initNodes(1);

    function updateNodeScale(s) {
      for (let i = 0; i < NUM_POINTS; i++) {
        const angle = (i / NUM_POINTS) * Math.PI * 2;
        let baseR = 62 * s;
        if (Math.sin(angle) > 0) baseR += Math.sin(angle) * 9 * s;
        if (Math.cos(angle) < 0 && Math.sin(angle) > 0) baseR += 4 * s;
        nodes[i].ox = Math.cos(angle) * baseR;
        nodes[i].oy = Math.sin(angle) * (baseR * 0.94);
      }
    }

    const STIFFNESS = 0.075;
    const NEIGHBOR_PULL = 0.14;
    const DAMPING = 0.87;
    const MARGIN = 6;

    function nextEmotion(step) {
      if (typeof step !== 'number') step = 1;
      currentEmotion = (currentEmotion + step + emotions.length) % emotions.length;
      nextEmotionTime = Date.now() + 5000 + Math.random() * 4000;
    }

    function isAnySceneActive() {
      return vape.active || bulbScene.active || blocksScene.active || slideScene.active || life.state !== 'alive';
    }

    function startVape() {
      if (isAnySceneActive()) return;
      walker.isWalking = false;
      vape.active = true;
      vape.timer = 0;
      vape.nextAutoTime = Date.now() + 14000 + Math.random() * 10000;
    }

    function triggerDeath() {
      vape.active = false;
      walker.isWalking = false;
      bulbScene.active = false;
      blocksScene.active = false;
      slideScene.active = false;
      isDragging = false;
      life.state = 'dying';
      life.timer = 0;
      life.ghostY = center.y;
      life.ghostAlpha = 0.7;
    }

    function triggerRebirth() {
      life.state = 'reborn';
      life.timer = 0;
      life.scale = 0.35;
      vape.blueLevel = 0;
      center.x = 240;
      center.y = 70;
      initNodes(0.35);
      currentEmotion = 3;
      nextEmotionTime = Date.now() + 4000;
    }

    function startBulbScene() {
      if (isAnySceneActive()) return;
      walker.isWalking = false;
      bulbScene.active = true;
      bulbScene.timer = 0;
      bulbScene.ladderVisible = true;
      bulbScene.bulbState = 'screwing';
      bulbScene.shards = [];
      bulbScene.flashAlpha = 0;
      currentEmotion = 0;
    }

    function startBlocksScene() {
      if (isAnySceneActive()) return;
      walker.isWalking = false;
      blocksScene.active = true;
      blocksScene.timer = 0;
      blocksScene.phase = 'falling';
      blocksScene.currentIdx = 0;
      blocksScene.shapeType = Math.floor(Math.random() * 3);
      currentEmotion = 3;

      const size = 24;
      const floorY = canvas.height - MARGIN - size / 2;
      const colors = ['#ef4444', '#3b82f6', '#eab308', '#10b981'];

      let targets = [];
      if (blocksScene.shapeType === 0) {
        targets = [
          { x: 240, y: floorY },
          { x: 240, y: floorY - size },
          { x: 240, y: floorY - size * 2 },
          { x: 240, y: floorY - size * 3 }
        ];
      } else if (blocksScene.shapeType === 1) {
        targets = [
          { x: 240 - size, y: floorY },
          { x: 240, y: floorY },
          { x: 240 + size, y: floorY },
          { x: 240, y: floorY - size }
        ];
      } else {
        targets = [
          { x: 240 - size, y: floorY },
          { x: 240 + size, y: floorY },
          { x: 240 - size * 0.5, y: floorY - size },
          { x: 240 + size * 0.5, y: floorY - size }
        ];
      }

      blocksScene.blocks = [];
      for (let i = 0; i < 4; i++) {
        let rx = i % 2 === 0 ? (45 + Math.random() * 115) : (320 + Math.random() * 115);
        blocksScene.blocks.push({
          x: rx,
          y: -20 - i * 35,
          vy: 0,
          size: size,
          color: colors[i],
          tx: targets[i].x,
          ty: targets[i].y,
          placed: false,
          carried: false
        });
      }
    }

    function startSlideScene() {
      if (isAnySceneActive()) return;
      walker.isWalking = false;
      slideScene.active = true;
      slideScene.phase = 'approach';
      slideScene.timer = 0;
      slideScene.progress = 0;
      slideScene.speed = 0;
      currentEmotion = 0;
    }

    function pokeJelly(step) {
      if (bulbScene.active || blocksScene.active || slideScene.active || life.state === 'dying') return;
      if (typeof step !== 'number') step = 1;
      walker.isWalking = false;
      walker.nextWalkTime = Date.now() + 2500;
      if (Math.random() < 0.25 && !vape.active && life.state === 'alive') {
        startVape();
      } else {
        nextEmotion(step);
      }
      const slideVx = (Math.random() - 0.5) * 14;
      for (let i = 0; i < NUM_POINTS; i++) {
        const factor = nodes[i].oy < 0 ? 1.4 : 0.6;
        nodes[i].vx += slideVx * factor;
        nodes[i].vy += (nodes[i].oy < 0 ? 3.5 : -1.5);
      }
    }

    function setupMediaSession() {}

    function handleOrientation(e) {
      if (!tiltEnabled || e.gamma === null || e.beta === null) return;
      gravity.x = Math.max(-0.7, Math.min(0.7, e.gamma * 0.018));
      gravity.y = Math.max(-0.7, Math.min(0.7, (e.beta - 35) * 0.018));
    }

    function handleMotion(e) {
      if (!tiltEnabled) return;
      const pureAcc = e.acceleration;
      if (pureAcc && (Math.abs(pureAcc.x) > 13 || Math.abs(pureAcc.y) > 13)) {pokeJelly(1);
}
}
tiltBtn.addEventListener('click', async () => {
if (!tiltEnabled) {
try {
if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
const permission = await DeviceOrientationEvent.requestPermission();
if (permission !== 'granted') {
alert('Доступ к гироскопу отклонен. Перезагрузите страницу и нажмите «Разрешить».');
return;
}
}
if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
await DeviceMotionEvent.requestPermission();
}
} catch (err) {
alert('Ошибка доступа к датчикам: ' + err.message);
return;
}
window.addEventListener('deviceorientation', handleOrientation);
window.addEventListener('devicemotion', handleMotion);
tiltEnabled = true;
walker.isWalking = false;
tiltBtn.textContent = 'Гироскоп: ВКЛ';
tiltBtn.classList.add('active');
} else {
tiltEnabled = false;
window.removeEventListener('deviceorientation', handleOrientation);
window.removeEventListener('devicemotion', handleMotion);
gravity = { x: 0, y: 0.42 };
tiltBtn.textContent = 'Гироскоп: ВЫКЛ';
tiltBtn.classList.remove('active');
walker.nextWalkTime = Date.now() + 1500;
}
});
function getPos(e) {
const rect = canvas.getBoundingClientRect();
const clientX = (e.touches && e.touches.length > 0) ? e.touches.clientX : e.clientX;
const clientY = (e.touches && e.touches.length > 0) ? e.touches.clientY : e.clientY;
return {
x: (clientX - rect.left) * (canvas.width / rect.width),
y: (clientY - rect.top) * (canvas.height / rect.height)
};
}
canvas.addEventListener('pointerdown', (e) => {
if (bulbScene.active || blocksScene.active || slideScene.active || life.state === 'dying') return;
const pos = getPos(e);
if (Math.hypot(pos.x - center.x, pos.y - center.y) <= 95 * life.scale + 15) {
isDragging = true;
walker.isWalking = false;
dragMoved = false;
lastPointer = { x: pos.x, y: pos.y };
for (let n of nodes) {
n.vx += (n.x - pos.x) * 0.08;
n.vy += (n.y - pos.y) * 0.08;
}
}
});
canvas.addEventListener('pointermove', (e) => {
if (!isDragging || bulbScene.active || blocksScene.active || slideScene.active || life.state === 'dying') return;
const pos = getPos(e);
const dx = pos.x - lastPointer.x;
const dy = pos.y - lastPointer.y;
if (Math.hypot(dx, dy) > 3) dragMoved = true;
for (let n of nodes) {
const dist = Math.hypot(n.x - pos.x, n.y - pos.y);
const weight = Math.max(0.25, 1 - dist / 165);
n.x += dx * weight;
n.y += dy * weight;
n.vx = dx * 0.75;
n.vy = dy * 0.75;
}
lastPointer = { x: pos.x, y: pos.y };
});
canvas.addEventListener('pointerup', () => {
if (isDragging) {
if (!dragMoved) pokeJelly(1);
isDragging = false;
walker.nextWalkTime = Date.now() + 2500;
}
});
function moveCharacterTo(tx, ty, speed) {
const dx = tx - center.x;
const dy = ty - center.y;
for (let n of nodes) {
n.x += dx * speed;
n.y += dy * speed;
n.vx = dx * speed * 0.5;
n.vy = dy * speed * 0.5;
}
}
function glideCharacterX(tx) {
const distX = tx - center.x;
if (Math.abs(distX) > 4) {
const dir = Math.sign(distX);
const speed = Math.min(0.95, Math.abs(distX) * 0.035);
for (let i = 0; i < NUM_POINTS; i++) {
const lean = nodes[i].oy < 0 ? 1.15 : 0.9;
nodes[i].vx += dir * speed * lean;
}
}
}
function updateSlideScene() {
slideScene.timer++;
const s = life.scale;
const floorCenterY = canvas.height - MARGIN - 54 * s;
if (slideScene.phase === 'approach') {
moveCharacterTo(105, floorCenterY, 0.11);
if (Math.abs(center.x - 105) < 10 && slideScene.timer > 25) {
slideScene.phase = 'climbing';
slideScene.timer = 0;
}
} else if (slideScene.phase === 'climbing') {
const topY = 92 - 46 * s;
moveCharacterTo(155, topY, 0.085);
if (Math.abs(center.y - topY) < 6 && slideScene.timer > 45) {
slideScene.phase = 'sliding';
slideScene.progress = 0;
slideScene.speed = 0.008;
currentEmotion = 3;
}
} else if (slideScene.phase === 'sliding') {
slideScene.speed = Math.min(0.036, slideScene.speed + 0.0009);
slideScene.progress += slideScene.speed;
const t = Math.min(1, slideScene.progress);
const p0 = { x: 165, y: 92 - 46 * s };
const p1 = { x: 235, y: 225 - 46 * s };
const p2 = { x: 375, y: 250 - 46 * s };
const invT = 1 - t;
const targetX = invT * invT * p0.x + 2 * invT * t * p1.x + t * t * p2.x;
const targetY = invT * invT * p0.y + 2 * invT * t * p1.y + t * t * p2.y;
moveCharacterTo(targetX, targetY, 0.45);
if (t >= 1) {
slideScene.phase = 'landed';
slideScene.timer = 0;
currentEmotion = 1;
nextEmotionTime = Date.now() + 5000;
for (let i = 0; i < NUM_POINTS; i++) {
nodes[i].vx += 5.5;
}
}
} else if (slideScene.phase === 'landed') {
if (slideScene.timer > 125) {
slideScene.active = false;
walker.nextWalkTime = Date.now() + 2000;
}
}
}
function drawSlide() {
if (!slideScene.active) return;
ctx.save();
ctx.strokeStyle = '#525660';
ctx.lineWidth = 5;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(140, 92); ctx.lineTo(140, 264);
ctx.moveTo(170, 92); ctx.lineTo(170, 264);
ctx.moveTo(265, 200); ctx.lineTo(265, 264);
ctx.stroke();
ctx.strokeStyle = '#a1a1aa';
ctx.lineWidth = 5;
ctx.beginPath();
ctx.moveTo(95, 264); ctx.lineTo(140, 92);
ctx.stroke();
ctx.lineWidth = 3.5;
for (let i = 1; i <= 5; i++) {
const ratio = i / 6;
const sx = 95 + (140 - 95) * ratio;
const sy = 264 + (92 - 264) * ratio;
ctx.beginPath();
ctx.moveTo(sx - 6, sy); ctx.lineTo(sx + 8, sy);
ctx.stroke();
}
ctx.strokeStyle = '#38bdf8';
ctx.lineWidth = 7;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(138, 92); ctx.lineTo(168, 92);
ctx.quadraticCurveTo(235, 225, 385, 254);
ctx.stroke();
ctx.strokeStyle = '#bae6fd';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(138, 90); ctx.lineTo(168, 90);
ctx.quadraticCurveTo(235, 223, 385, 252);
ctx.stroke();
ctx.restore();
}
function updateBlocksScene() {
blocksScene.timer++;
const floorY = canvas.height - MARGIN - 12;
for (let b of blocksScene.blocks) {
if (!b.placed && !b.carried) {
b.vy += 0.45;
b.y += b.vy;
if (b.y > floorY) {
b.y = floorY;
b.vy = -b.vy * 0.35;
}
}
}
if (blocksScene.phase === 'falling') {
if (blocksScene.timer > 65) {
blocksScene.phase = 'collecting';
currentEmotion = 0;
}
} else if (blocksScene.phase === 'collecting') {
const b = blocksScene.blocks[blocksScene.currentIdx];
glideCharacterX(b.x);
if (Math.abs(center.x - b.x) < 28) {
b.carried = true;
blocksScene.phase = 'carrying';
}
} else if (blocksScene.phase === 'carrying') {
const b = blocksScene.blocks[blocksScene.currentIdx];
b.x = center.x;
b.y = center.y - 68 * life.scale;
const approachX = b.x < b.tx ? b.tx - 58 : b.tx + 58;
glideCharacterX(approachX);
if (Math.abs(center.x - approachX) < 22) {
b.carried = false;
b.placed = true;
b.x = b.tx;
b.y = b.ty;
blocksScene.currentIdx++;
if (blocksScene.currentIdx >= 4) {
blocksScene.phase = 'admire';
blocksScene.timer = 0;
currentEmotion = 1;
} else {
blocksScene.phase = 'collecting';
}
}
} else if (blocksScene.phase === 'admire') {
glideCharacterX(115);
if (blocksScene.timer > 150) {
blocksScene.active = false;
walker.nextWalkTime = Date.now() + 2000;
}
}
}
function drawBlocks() {
if (!blocksScene.active) return;
ctx.save();
for (let b of blocksScene.blocks) {
const hs = b.size / 2;
ctx.fillStyle = b.color;
ctx.strokeStyle = '#111214';
ctx.lineWidth = 3;
ctx.beginPath();
ctx.roundRect(b.x - hs, b.y - hs, b.size, b.size, 5);
ctx.fill();
ctx.stroke();
ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
ctx.fillRect(b.x - hs + 4, b.y - hs + 4, b.size - 8, 5);
}
ctx.restore();
}
function updateBulbScene() {
bulbScene.timer++;
const t = bulbScene.timer;
if (t <= 55) {
moveCharacterTo(240, 200, 0.12);
} else if (t > 55 && t <= 110) {
moveCharacterTo(240, 115, 0.1);
} else if (t > 110 && t <= 170) {
const wiggle = Math.sin(t * 0.5) * 6;
moveCharacterTo(240 + wiggle, 115, 0.25);
if (t === 155) {
bulbScene.bulbState = 'lit';
currentEmotion = 1;
}
} else if (t > 170 && t <= 225) {
moveCharacterTo(240, 200, 0.11);
} else if (t === 226) {
bulbScene.ladderVisible = false;
currentEmotion = 0;
} else if (t === 286) {
bulbScene.bulbState = 'broken';
bulbScene.flashAlpha = 0.85;
currentEmotion = 3;
nextEmotionTime = Date.now() + 4500;
for (let i = 0; i < NUM_POINTS; i++) {
nodes[i].vy -= (nodes[i].oy < 0 ? 7 : 3);
nodes[i].vx += (Math.random() - 0.5) * 10;
}
for (let k = 0; k < 14; k++) {
bulbScene.shards.push({
x: 240 + (Math.random() - 0.5) * 16,
y: 44 + (Math.random() - 0.5) * 16,
vx: (Math.random() - 0.5) * 9,
vy: (Math.random() - 0.7) * 7,
size: 3 + Math.random() * 4,
alpha: 1
});
}
} else if (t > 380) {
bulbScene.active = false;
bulbScene.bulbState = 'none';
walker.nextWalkTime = Date.now() + 2000;
}
if (bulbScene.flashAlpha > 0) {
bulbScene.flashAlpha = Math.max(0, bulbScene.flashAlpha - 0.06);
}
}
function updateSlidingAI() {
if (isDragging || isAnySceneActive() || tiltEnabled) return;
const now = Date.now();
if (!walker.isWalking && now > walker.nextWalkTime) {
const mid = canvas.width / 2;
if (center.x < mid) {
walker.targetX = mid + 20 + Math.random() * (mid - 105);
} else {
walker.targetX = 85 + Math.random() * (mid - 105);
}
walker.isWalking = true;
}
if (walker.isWalking) {
const distX = walker.targetX - center.x;
if (Math.abs(distX) < 12) {
walker.isWalking = false;
walker.nextWalkTime = now + 2000 + Math.random() * 3000;
if (Math.random() < 0.45) nextEmotion(1);
} else {
if (center.y > canvas.height - 95) {
const dir = Math.sign(distX);
const glideSpeed = dir > 0 ? 0.42 : 0.36;
for (let i = 0; i < NUM_POINTS; i++) {
const lean = nodes[i].oy < 0 ? 1.15 : 0.9;
nodes[i].vx += dir * glideSpeed * lean;
}
}
}
}
}
function updateLiquidPhysics() {
let sumX = 0, sumY = 0, sumVx = 0, sumVy = 0;
for (let i = 0; i < NUM_POINTS; i++) {
sumX += nodes[i].x; sumY += nodes[i].y;
sumVx += nodes[i].vx; sumVy += nodes[i].vy;
}
center.x = sumX / NUM_POINTS; center.y = sumY / NUM_POINTS;
center.vx = sumVx / NUM_POINTS; center.vy = sumVy / NUM_POINTS;
if (isNaN(center.x) || isNaN(center.y)) {
center.x = 240; center.y = 155;
initNodes(life.scale);
return;
}
const disableGravity = isDragging ||
(bulbScene.active && bulbScene.timer <= 225) ||
(slideScene.active && slideScene.phase !== 'landed');
for (let i = 0; i < NUM_POINTS; i++) {
let n = nodes[i];
let prev = nodes[(i - 1 + NUM_POINTS) % NUM_POINTS];
let next = nodes[(i + 1) % NUM_POINTS];
if (!disableGravity) {
n.vx += gravity.x;
n.vy += gravity.y;
}
n.vx += (center.x + n.ox - n.x) * STIFFNESS;
n.vy += (center.y + n.oy - n.y) * STIFFNESS;

}
