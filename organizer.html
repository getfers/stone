<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Камешек · Органайзер</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="renderer/organizer.mjs"></script>
</head>
<body class="organizer">
  <header class="app-header">
    <div class="brand"><img src="assets/stone.png" alt="" width="32" height="32"> Камешек</div>
    <nav class="organizer-nav" aria-label="Разделы органайзера">
      <button type="button" data-section="notes" aria-pressed="true">Заметки</button>
      <button type="button" data-section="alarms" aria-pressed="false">Будильники</button>
    </nav>
  </header>
  <main class="organizer-layout">
    <section class="organizer-records" aria-labelledby="organizer-title">
      <h1 id="organizer-title">Заметки</h1>
      <p id="organizer-subtitle"></p>
      <ul id="organizer-list" class="organizer-list"></ul>
      <p id="organizer-empty" class="empty-state" hidden></p>
    </section>
    <section class="organizer-editor" aria-labelledby="editor-title">
      <div class="editor-heading">
        <h2 id="editor-title">Новая заметка</h2>
        <button id="new-entry" class="text-button" type="button" hidden>Добавить</button>
      </div>
      <form id="note-form">
        <label>Текст заметки
          <textarea id="note-text" rows="4" maxlength="600" placeholder="Что нужно запомнить?" required></textarea>
        </label>
        <label>Напомнить
          <input id="note-at" type="datetime-local" aria-describedby="note-hint">
          <small id="note-hint">Пустое поле оставит запись обычной заметкой.</small>
        </label>
        <div class="editor-actions">
          <button class="primary-button" type="submit">Сохранить заметку</button>
          <button class="text-button editor-delete" type="button" hidden>Удалить</button>
        </div>
      </form>
      <form id="alarm-form" hidden>
        <div class="alarm-fields">
          <label>Время<input id="alarm-time" type="time" value="07:00" required></label>
          <label>Подпись<input id="alarm-label" type="text" maxlength="100" placeholder="Например, утренняя зарядка"></label>
        </div>
        <fieldset>
          <legend>Дни недели</legend>
          <div class="day-pills" id="alarm-days"></div>
          <small>Без выбранных дней прозвонит один раз.</small>
        </fieldset>
        <div class="sound-picker">
          <label>Сигнал<select id="alarm-sound"></select></label>
          <button class="text-button" type="button" id="preview-sound">Прослушать</button>
        </div>
        <label class="check-label"><input id="alarm-enabled" type="checkbox" checked> Включён</label>
        <div class="editor-actions">
          <button class="primary-button" type="submit">Сохранить будильник</button>
          <button class="text-button editor-delete" type="button" hidden>Удалить</button>
        </div>
      </form>
      <p id="editor-status" role="status"></p>
      <dialog id="delete-dialog">
        <form method="dialog">
          <h2 id="delete-title"></h2>
          <div class="editor-actions">
            <button class="text-button" value="cancel" autofocus>Отмена</button>
            <button class="primary-button" value="delete">Удалить</button>
          </div>
        </form>
      </dialog>
    </section>
  </main>
</body>
</html>
